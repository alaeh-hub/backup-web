name: Release installer

# Push a tag like v1.0.1 (git tag v1.0.1 && git push origin v1.0.1) and this builds
# AlaEhBackup.exe + AlaEhBackup-Setup.exe on Windows and publishes them as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version "${{ github.ref_name }}"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" installer/out/AlaEhBackup-Setup.exe installer/out/AlaEhBackup.exe --title "Ala Eh! File Backup ${{ github.ref_name }}" --generate-notes
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: installer
          path: installer/out/*.exe
