name: Release installer

# Every push to main (i.e. a merged PR) reads the version from frontend/package.json.
# If a release for that version does not exist yet, it builds AlaEhBackup.exe + AlaEhBackup-Setup.exe on Windows,
# creates the tag vX.Y.Z and publishes a GitHub Release. If the version was not bumped, nothing is released.
# Run manually from the Actions tab to just build the files as a downloadable artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          if (-not $v) { throw "No version in frontend/package.json" }
          gh release view "v$v" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          $publish = ($env:GITHUB_EVENT_NAME -eq 'push') -and -not $exists
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "Release v$v already exists: bump the version to publish a new one." }

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: choco install innosetup -y --no-progress
      - name: Build installer
        if: steps.ver.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./installer/build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.ver.outputs.version }}" installer/out/AlaEhBackup-Setup.exe installer/out/AlaEhBackup.exe --target "${{ github.sha }}" --title "Ala Eh! File Backup v${{ steps.ver.outputs.version }}" --generate-notes

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: installer
          path: installer/out/*.exe
